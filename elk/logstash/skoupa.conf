# Emplacement réel : /etc/logstash/pipeline/skoupa.conf
#
# Pipeline "skoupa" — point d'entrée du pipeline Logstash.
# Reçoit tous les events Beats (Filebeat, Winlogbeat) sur le port 5044
# et les transmet en interne vers le pipeline "straight-es" via la pipe to-es.
#
# Ce découpage en deux pipelines permet de séparer la réception des events
# de la logique de routing/enrichissement, facilitant la maintenance.

input {
  beats {
    port        => 5044
    ssl_enabled => false
  }
}

output {
  pipeline { send_to => ["to-es"] }
}
